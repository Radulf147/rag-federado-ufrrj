# Projeto: Agente RAG Federado — UFRRJ
# Orquestração: ChromaDB (servidor) + pipeline ETL + agente
#
# MOVIDO: este arquivo antes vivia em modulo1_etl/. Agora vive na raiz —
# o build context precisa enxergar config.py, modulo1_etl/,
# modulo2_inferencia/ e interfaces/ ao mesmo tempo.

services:

  # -------------------------------------------------------------------
  # ChromaDB — banco de vetores persistente
  # -------------------------------------------------------------------
  chromadb:
    image: chromadb/chroma:0.5.23
    container_name: rag_chromadb
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - chroma_data:/chroma/chroma
    environment:
      - CHROMA_SERVER_AUTHN_CREDENTIALS_FILE=""
      - ANONYMIZED_TELEMETRY=false

  # -------------------------------------------------------------------
  # Pipeline ETL — scraping → chunking → embedding → carga
  # Roda uma vez e encerra (não é um serviço contínuo)
  # -------------------------------------------------------------------
  etl:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rag_etl
    depends_on:
      chromadb:
        condition: service_started
    env_file:
      - .env
    volumes:
      # dados/ montado para o sigaa.db sobreviver ao --rm. Sem isto o
      # SQLite era escrito em /app dentro do container e destruido junto
      # com ele — o lado estruturado do RAG ficava sem dado nenhum.
      - ./dados:/app/dados
      - ./logs:/app/logs
      # docs/ tambem no etl, nao so no agente. Sem isto qualquer relatorio
      # escrito por um script do modulo 1 (ex.: modulo1_etl/auditoria_perfis.py)
      # e destruido junto com o container no --rm — mesmo defeito que o
      # sigaa.db teve, e que ja custou uma auditoria de 40 requisicoes.
      - ./docs:/app/docs
      - models_cache:/app/models_cache
    environment:
      - CHROMA_HOST=chromadb
      - CHROMA_PORT=8000
      # caminho de container, por isso vive aqui e nao no .env
      - DB_PATH=/app/dados/sigaa.db
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: "no"
    # Antes: "python parte5_carga.py" (rodava de dentro de modulo1_etl/).
    # Agora o WORKDIR é a raiz do projeto dentro do container, então o
    # caminho leva o prefixo modulo1_etl/. Os imports internos de
    # parte5_carga.py (from parte1_scraping_sigaa import ...) continuam
    # funcionando normalmente: rodar "python modulo1_etl/parte5_carga.py"
    # ainda coloca a pasta do próprio script (modulo1_etl/) no sys.path.
    command: python modulo1_etl/parte5_carga.py

  # -------------------------------------------------------------------
  # Agente RAG — interface de perguntas e respostas
  # -------------------------------------------------------------------
  agente:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rag_agente
    depends_on:
      chromadb:
        condition: service_started
    env_file:
      - .env
    volumes:
      # docs/ montado para o relatorio de interfaces/comparar.py sair do
      # container e aterrissar no repositorio (CLAUDE.md 3)
      - ./docs:/app/docs
      # dados/ montado para o sigaa.db sobreviver ao --rm. Sem isto o
      # SQLite era escrito em /app dentro do container e destruido junto
      # com ele — o lado estruturado do RAG ficava sem dado nenhum.
      - ./dados:/app/dados
      - ./logs:/app/logs
      - models_cache:/app/models_cache
    environment:
      - CHROMA_HOST=chromadb
      - CHROMA_PORT=8000
      # caminho de container, por isso vive aqui e nao no .env
      - DB_PATH=/app/dados/sigaa.db
      # OLLAMA_HOST sai do .env de proposito: aqui no environment ele
      # sobrepunha o .env e apontava para host-gateway:11434 — host nao
      # resolvivel e porta errada (o tunel escuta na 9999).
    restart: unless-stopped
    stdin_open: true
    tty: true
    # Antes: "python teste_llm.py". Agora chama o pacote interfaces/ via
    # -m, que exige rodar a partir da raiz (WORKDIR /app já cobre isso).
    command: python -m interfaces.cli
    profiles:
      - agente

# -------------------------------------------------------------------
# Volumes nomeados — persistem entre reinicializações
# -------------------------------------------------------------------
volumes:
  chroma_data:
    driver: local
  logs_data:
    driver: local
  models_cache:
    driver: local
